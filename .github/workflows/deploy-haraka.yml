name: Deploy Haraka Mail Server

on:
  push:
    branches:
      - main
    paths:
      - 'services/haraka/**'
      - 'docker/**'
      - '.github/workflows/deploy-haraka.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Haraka Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/haraka
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/haraka-mail:latest
            ${{ secrets.DOCKER_REGISTRY }}/haraka-mail:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/haraka-mail:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/haraka-mail:buildcache,mode=max

      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/mail-service
            docker-compose -f docker-compose.prod.yml pull haraka
            docker-compose -f docker-compose.prod.yml up -d haraka
            docker image prune -f