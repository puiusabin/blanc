version: '3.8'

services:
  haraka:
    image: instrumentisto/haraka:latest
    container_name: blanc-haraka
    working_dir: /etc/haraka
    ports:
      - "25:25"      # SMTP
      - "587:587"    # Submission (STARTTLS)
    volumes:
      # Mount entire service directory
      - .:/etc/haraka
      # Mount @blanc/database package from monorepo
      - ../../packages/database:/etc/haraka/node_modules/@blanc/database
    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL}
      # Cloudflare R2 credentials
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET:-mail-storage}
      # Optional overrides
      ENCRYPTION_ENABLED: ${ENCRYPTION_ENABLED:-false}
      NODE_ENV: ${NODE_ENV:-production}
    env_file:
      - .env
    command: sh -c "npm install --production && haraka -c /etc/haraka"
    restart: unless-stopped
    networks:
      - blanc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  blanc-network:
    driver: bridge
