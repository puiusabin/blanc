version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mail-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mail-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Haraka Mail Server
  haraka:
    build:
      context: ../services/haraka
      dockerfile: Dockerfile
    container_name: mail-haraka-prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      HARAKA_DOMAIN: ${HARAKA_DOMAIN}
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    volumes:
      - haraka_config:/app/config
      - haraka_logs:/var/log/haraka
      - tls_certs:/etc/haraka/tls:ro
    networks:
      - mail-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mail-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - tls_certs:/etc/nginx/certs:ro
    networks:
      - mail-network
    restart: unless-stopped
    depends_on:
      - haraka

networks:
  mail-network:
    driver: bridge

volumes:
  postgres_data:
  haraka_config:
  haraka_logs:
  tls_certs: