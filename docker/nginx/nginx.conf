events {
    worker_connections 1024;
}

http {
    upstream haraka_smtp {
        server haraka:587;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name mail.example.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS configuration
    server {
        listen 443 ssl http2;
        server_name mail.example.com;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy to mail server admin interface (if needed)
        location / {
            return 200 "Mail server running\n";
            add_header Content-Type text/plain;
        }
    }
}

# Stream configuration for SMTP proxying (optional)
stream {
    upstream smtp_backend {
        server haraka:25;
    }

    upstream submission_backend {
        server haraka:587;
    }

    upstream smtps_backend {
        server haraka:465;
    }

    server {
        listen 25;
        proxy_pass smtp_backend;
        proxy_timeout 30s;
    }

    server {
        listen 587;
        proxy_pass submission_backend;
        proxy_timeout 30s;
    }

    server {
        listen 465;
        proxy_pass smtps_backend;
        proxy_timeout 30s;
    }
}